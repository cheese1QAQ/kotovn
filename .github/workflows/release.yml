name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Python wheel & sdist
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run pytest
          uv build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build desktop web bundle
        working-directory: desktop
        run: |
          npm ci
          npm run build
          tar -czf ../kotovn-desktop-web-${{ github.ref_name }}.tar.gz dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            backend/dist/*
            kotovn-desktop-web-${{ github.ref_name }}.tar.gz
